<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>중세 암호</title>
    <link rel="stylesheet" href="index.css" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap');

      .page-header {
        margin-bottom: 48px;
        border-bottom: 1px solid #e5e7eb;
        padding-bottom: 20px;
        opacity: 0;
        transform: translateY(20px);
        transition:
          opacity 0.6s ease,
          transform 0.6s ease;
      }
      .page-header.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .page-header h1 {
        font-size: 1.8rem;
        font-weight: 600;
        color: #1e293b;
        margin-bottom: 6px;
      }
      .page-header p {
        font-size: 0.88rem;
        color: #9ca3af;
      }

      .section-divider {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
        opacity: 0;
        transform: translateY(16px);
        transition:
          opacity 0.5s ease,
          transform 0.5s ease;
      }
      .section-divider.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .section-divider span {
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #9ca3af;
        white-space: nowrap;
      }
      .section-divider::before,
      .section-divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: #e5e7eb;
      }

      .cipher-block {
        display: grid;
        grid-template-columns: 1fr 1fr;
        border: 1.5px solid #e5e7eb;
        border-radius: 12px;
        overflow: hidden;
        margin-bottom: 32px;
        transition:
          box-shadow 0.3s,
          border-color 0.3s,
          opacity 0.7s ease,
          transform 0.7s ease;
        opacity: 0;
        transform: translateY(30px);
        align-items: stretch;
      }
      .cipher-block.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .cipher-block:hover {
        box-shadow: 0 8px 32px rgba(99, 102, 241, 0.1);
        border-color: #c7d2fe;
      }

      .cipher-info {
        padding: 40px 36px;
        background: #fff;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
      }
      .cipher-tag {
        display: inline-block;
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #6366f1;
        background: #eef2ff;
        padding: 4px 12px;
        border-radius: 20px;
        margin-bottom: 14px;
        width: fit-content;
      }
      .cipher-info h2 {
        font-size: 1.5rem;
        font-weight: 600;
        color: #1e293b;
        margin-bottom: 4px;
        font-family: 'Noto Serif KR', serif;
      }
      .cipher-year {
        font-size: 0.76rem;
        color: #9ca3af;
        margin-bottom: 18px;
        font-family: monospace;
      }
      .cipher-info p {
        font-size: 0.88rem;
        color: #475569;
        line-height: 1.85;
        margin-bottom: 12px;
      }
      .cipher-point {
        background: #f8fafc;
        border-left: 3px solid #6366f1;
        padding: 12px 16px;
        border-radius: 0 8px 8px 0;
        font-size: 0.82rem;
        color: #4338ca;
        line-height: 1.7;
        margin-top: 8px;
      }

      .cipher-demo {
        background: #f8f9ff;
        border-left: 1.5px solid #e5e7eb;
        padding: 36px 28px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .demo-title {
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #9ca3af;
        margin-bottom: 4px;
      }
      .demo-label {
        font-size: 0.8rem;
        color: #6b7280;
        margin-bottom: 2px;
      }
      .demo-input {
        width: 100%;
        padding: 9px 13px;
        border: 1.5px solid #e5e7eb;
        border-radius: 8px;
        font-size: 0.88rem;
        color: #1e293b;
        background: white;
        outline: none;
        transition: border-color 0.2s;
        font-family: monospace;
        box-sizing: border-box;
      }
      .demo-input:focus {
        border-color: #6366f1;
      }
      .demo-slider-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .demo-slider-row input[type='range'] {
        flex: 1;
        accent-color: #6366f1;
      }
      .demo-slider-val {
        font-size: 0.85rem;
        font-weight: 600;
        color: #6366f1;
        min-width: 24px;
        text-align: center;
        font-family: monospace;
      }
      .demo-output-box {
        background: white;
        border: 1.5px solid #c7d2fe;
        border-radius: 8px;
        padding: 11px 14px;
        font-family: monospace;
        font-size: 0.95rem;
        color: #4338ca;
        letter-spacing: 0.08em;
        min-height: 42px;
        word-break: break-all;
        line-height: 1.6;
        white-space: pre;
      }

      /* 버튼 그룹 */
      .btn-group {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .demo-btn {
        padding: 7px 14px;
        border-radius: 6px;
        font-size: 0.78rem;
        font-weight: 500;
        cursor: pointer;
        border: 1.5px solid #e5e7eb;
        background: white;
        color: #374151;
        transition: all 0.2s;
      }
      .demo-btn:hover {
        border-color: #6366f1;
        color: #6366f1;
        background: #eef2ff;
      }
      .demo-btn.primary {
        background: #6366f1;
        color: white;
        border-color: #6366f1;
      }
      .demo-btn.primary:hover {
        background: #4f46e5;
      }
      .demo-btn.success {
        background: #f0fdf4;
        color: #166534;
        border-color: #bbf7d0;
      }

      /* 알베르티 디스크 */
      .alberti-disk {
        display: flex;
        justify-content: center;
        margin: 4px 0;
      }
      .disk-wrap {
        position: relative;
        width: 150px;
        height: 150px;
      }
      #outerDisk {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: #eef2ff;
        border: 2px solid #c7d2fe;
      }
      #innerDisk {
        position: absolute;
        top: 28px;
        left: 28px;
        width: 94px;
        height: 94px;
        border-radius: 50%;
        background: white;
        border: 2px solid #6366f1;
        transition: transform 0.4s ease;
      }

      /* 비즈네르 표 */
      .vigenere-table-wrap {
        margin-top: 8px;
        overflow-x: auto;
        opacity: 0;
        transform: translateY(20px);
        transition:
          opacity 0.7s ease,
          transform 0.7s ease;
      }
      .vigenere-table-wrap.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .vigenere-table-wrap h3 {
        font-size: 0.78rem;
        font-weight: 600;
        color: #9ca3af;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 10px;
      }
      .vtable {
        border-collapse: collapse;
        font-family: monospace;
        font-size: 0.7rem;
      }
      .vtable td {
        width: 20px;
        height: 16px;
        text-align: center;
        border: 1px solid #f1f5f9;
        color: #64748b;
        transition: background 0.15s;
      }
      .vtable td.header {
        background: #eef2ff;
        color: #6366f1;
        font-weight: 700;
        border-color: #c7d2fe;
      }
      .vtable td.highlight {
        background: #6366f1;
        color: white;
        font-weight: 700;
        border-radius: 2px;
      }
      .vtable td.row-hl {
        background: #eef2ff;
        color: #4338ca;
      }
      .vtable td.col-hl {
        background: #f5f3ff;
        color: #4338ca;
      }

      /* 탭 버튼 */
      .demo-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
      }
      .tab-btns {
        display: flex;
        gap: 6px;
      }
      .tab-btn {
        padding: 5px 12px;
        border-radius: 6px;
        font-size: 0.75rem;
        font-weight: 500;
        cursor: pointer;
        border: 1.5px solid #e5e7eb;
        background: white;
        color: #9ca3af;
        transition: all 0.2s;
      }
      .tab-btn.active {
        background: #6366f1;
        color: white;
        border-color: #6366f1;
      }
      .tab-btn:hover:not(.active) {
        border-color: #6366f1;
        color: #6366f1;
      }

      /* 시뮬 패널 */
      #vigSimPanel {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 10px;
      }
      #vigTablePanel {
        margin-top: 10px;
      }

      @media (max-width: 800px) {
        .cipher-block {
          grid-template-columns: 1fr;
        }
        .cipher-demo {
          border-left: none;
          border-top: 1.5px solid #e5e7eb;
        }
      }
    </style>
  </head>

    </nav>

    <div class="main-content" id="main-content">
      <div class="container" id="pageContainer"></div>
    </div>

    <script src="medieval.js"></script>
    <script src="index.js"></script>
  </body>
</html>
